CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_USB=y

# Bluetooth stability & power saving
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Battery reporting for split peripheral
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# Trackball (PMW3610) - Disabled for power saving
CONFIG_SPI=n
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=n

# Boot-time inner/outer orientation selector on P0.08.
CONFIG_MODU_ALT_THUMB_KSCAN=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600


# PWM LED breath effect
CONFIG_PWM=y
CONFIG_MODU_LED_BREATH=y
