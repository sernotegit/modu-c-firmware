CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_USB=y

# Bluetooth stability & power saving
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_IDLE_TIMEOUT=15000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Key scanning: Interrupt-driven (disable polling to prevent battery drain)
CONFIG_ZMK_KSCAN_MATRIX_POLLING=n
CONFIG_ZMK_KSCAN_DIRECT_POLLING=n

# Trackball (PMW3610) - Disabled for power saving
CONFIG_SPI=n
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=n

# Boot-time inner/outer orientation selector on P0.08.
CONFIG_MODU_ALT_THUMB_KSCAN=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# PWM / LED: Disabled to eliminate HFCLK continuous power leak
CONFIG_PWM=n
CONFIG_MODU_LED_BREATH=n
